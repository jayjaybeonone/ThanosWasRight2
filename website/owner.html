<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Owner dashboard · The Wig Atelier &amp; Vault</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="owner">
<a class="skip-link" href="#main">Skip to main content</a>

<header class="site-header">
  <a class="brand" href="/owner">Owner <span>dashboard</span></a>
  <nav class="site-nav" aria-label="Owner">
    <a href="/">View site</a>
    <button type="button" class="btn btn-ghost btn-small" id="sign-out" hidden>Sign out</button>
  </nav>
</header>

<main class="owner-main" id="main" tabindex="-1">

  <!-- Sign-in -->
  <section id="login" class="section owner-login" aria-labelledby="login-title" hidden>
    <form id="login-form" class="card form" novalidate aria-labelledby="login-title">
      <h1 id="login-title">Sign in</h1>
      <p class="muted" id="token-help">Enter the owner token configured on the server (<code>ADMIN_TOKEN</code>).</p>
      <label for="token"><span>Owner token <span class="req">(required)</span></span>
        <input type="password" id="token" autocomplete="current-password" required aria-describedby="token-help login-error">
      </label>
      <p class="form-error" id="login-error" role="alert"></p>
      <button class="btn btn-primary" type="submit">Sign in</button>
    </form>
  </section>

  <!-- Dashboard -->
  <section id="dashboard" aria-labelledby="dash-title" hidden>
    <div class="section-head">
      <h1 id="dash-title">Today at a glance</h1>
      <p class="muted" id="updated" role="status">Loading…</p>
    </div>

    <h2 class="visually-hidden">Key numbers</h2>
    <div class="stat-grid" id="stats"></div>

    <h2 class="visually-hidden">Records</h2>
    <div class="tabs-bar">
      <div class="tabs" role="tablist" aria-label="Record type">
        <button type="button" role="tab" class="tab is-active" id="tab-bookings" data-tab="bookings" aria-selected="true" aria-controls="records-panel">Rentals</button>
        <button type="button" role="tab" class="tab" id="tab-locker" data-tab="locker" aria-selected="false" aria-controls="records-panel" tabindex="-1">Wig Locker</button>
        <button type="button" role="tab" class="tab" id="tab-consignments" data-tab="consignments" aria-selected="false" aria-controls="records-panel" tabindex="-1">Consignments</button>
      </div>
      <button type="button" class="btn btn-ghost btn-small refresh" id="refresh">Refresh</button>
    </div>

    <div id="records-panel" role="tabpanel" aria-labelledby="tab-bookings">
    <div class="filter">
      <label for="status-filter">Filter by status
        <select id="status-filter"></select>
      </label>
      <p class="muted" id="count" role="status"></p>
    </div>

    <p class="form-error" id="table-error" role="alert"></p>
    <div class="table-wrap" role="region" aria-labelledby="table-caption" tabindex="0">
      <table class="owner-table">
        <caption id="table-caption" class="visually-hidden">Rentals</caption>
        <thead id="table-head"></thead>
        <tbody id="table-body"></tbody>
      </table>
    </div>
    </div>
  </section>

</main>

<script src="owner.js"></script>
</body>
</html>
