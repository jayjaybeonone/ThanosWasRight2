# Fly.io config for The Wig Atelier & Vault.
# Deploy with: fly launch --no-deploy (first time), fly volumes create atelier_data --size 1,
# then fly deploy. See server/README.md for the full steps.

app = "wig-atelier-vault"   # must be globally unique on Fly; change it if the name is taken
primary_region = "iad"

[build]

[env]
  PORT = "8080"
  DB_PATH = "/data/atelier.db"

# SQLite is a single-writer database, so run exactly one machine.
[[mounts]]
  source = "atelier_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false   # keep the machine running so the first visitor isn't kept waiting
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/api/catalog"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
